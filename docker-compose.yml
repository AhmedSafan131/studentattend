name: student-attend-frontend

services:
  backend:
    build:
      context: ./BackEndProject
    ports:
      - "${BACKEND_PORT:-8000}:80"
    env_file:
      - ./BackEndProject/.env.docker
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: university_attendance
      DB_USERNAME: root
      DB_PASSWORD: root
    command: >
      sh -c "rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
      && php artisan migrate --force
      && exec apache2-foreground"
    volumes:
      - ./BackEndProject:/var/www/html
      - /var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ./BackEndProject
    env_file:
      - ./BackEndProject/.env.docker
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: university_attendance
      DB_USERNAME: root
      DB_PASSWORD: root
    command: php artisan schedule:work --no-interaction
    volumes:
      - ./BackEndProject:/var/www/html
      - /var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./FrontEndProject
    environment:
      FRONTEND_HOST_IP: "${FRONTEND_HOST_IP:-1.0.0.202}"
    ports:
      - "${FRONTEND_HTTP_PORT:-3000}:80"
      - "${FRONTEND_HTTPS_PORT:-3443}:443"
    volumes:
      - frontend_certs:/etc/nginx/certs
    depends_on:
      - backend
      - socket
    restart: unless-stopped

  socket:
    build:
      context: ./FrontEndProject
      target: socket
    ports:
      - "${SOCKET_PORT:-3001}:3001"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: university_attendance
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./university_attendance.sql:/docker-entrypoint-initdb.d/01-university_attendance.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "${PHPMYADMIN_PORT:-8090}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  frontend_certs:
