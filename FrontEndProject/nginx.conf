gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

# Protect the PHP workers from accidental hard-refresh storms on expensive
# read endpoints. The key combines client address and login token so normal
# users behind the same campus NAT do not throttle one another. Non-GET
# requests use an empty key and are never limited by this zone.
map "$request_method:$uri" $dashboard_read_identity {
    default "";
    ~^GET:/api/(admin/users|students|lecture-sessions|ad-hoc-attendance|catalog/subjects|attendance/(report|report-options)|admin/subject-absences)(/|$) "$binary_remote_addr:$http_authorization";
}
limit_req_zone $dashboard_read_identity zone=dashboard_read_guard:10m rate=6r/s;

server {
    listen 80;
    server_name _;
    add_header X-Robots-Tag "notranslate" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /student-service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /api/ {
        client_max_body_size 64m;
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Let a normal page load use a small immediate burst, then queue an
        # accidental refresh storm at Nginx instead of sending it to PHP all
        # at once. Only an extreme sustained burst is rejected.
        limit_req zone=dashboard_read_guard burst=30 delay=6;
        limit_req_status 429;
        limit_req_log_level warn;
    }

    location /socket.io/ {
        proxy_pass http://socket:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name _;
    add_header X-Robots-Tag "notranslate" always;

    ssl_certificate /etc/nginx/certs/student-attend.crt;
    ssl_certificate_key /etc/nginx/certs/student-attend.key;

    root /usr/share/nginx/html;
    index index.html;

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /student-service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /api/ {
        client_max_body_size 64m;
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=dashboard_read_guard burst=30 delay=6;
        limit_req_status 429;
        limit_req_log_level warn;
    }

    location /socket.io/ {
        proxy_pass http://socket:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
